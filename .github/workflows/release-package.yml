name: Release package

on:
  push:
    tags:
      - "core/[0-9]*"
      - "api/[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Read the package and version from the tag
        id: tag
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/}"
          name="${tag%%/*}"
          version="${tag#*/}"
          current=$(node -p "require('./packages/$name/package.json').version")
          if [ "$version" != "$current" ]; then
            echo "tag ($version) does not match packages/$name/package.json version ($current)" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:packages

      - name: Check whether the version is already on npm
        id: npm
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if npm view "@dotpm/$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        env:
          NAME: ${{ steps.tag.outputs.name }}
        run: pnpm --filter "@dotpm/$NAME" publish --access public --provenance --no-git-checks
