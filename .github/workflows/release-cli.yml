name: Release CLI

on:
  push:
    tags:
      - "cli/[0-9]*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@71c92474e7e4f5bca283fb17ef80fba9cdb2b4b1 # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: package.json
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches the package version
        env:
          REF: ${{ github.ref }}
        run: |
          tag="${REF#refs/tags/cli/}"
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "tag ($tag) does not match packages/cli/package.json version ($version)" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build:cli

      - name: Publish to npm
        run: pnpm --filter @dotpm/cli publish --access public --provenance --no-git-checks
