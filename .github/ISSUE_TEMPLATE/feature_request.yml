name: Feature request
description: Something dotpm should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where dotpm gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work. A sketch, a screenshot or a comparison to another tool all help.
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
